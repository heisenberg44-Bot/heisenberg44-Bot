<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>HEISENBERG44</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
  background:#f2f2f7;
  color:#111;
  overflow-x:hidden;
}
.app{min-height:100vh;padding-bottom:100px}

/* HEADER */
.header{
  height:92px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:0 18px;
  border-bottom:1px solid #ddd;
  position:sticky;
  top:0;
  z-index:20;
}
.close{font-size:21px}
.title{text-align:center;flex:1}
.title b{font-size:20px;display:block}
.title span{font-size:15px;color:#777}
.menu{
  width:38px;height:38px;border:2px solid #111;
  border-radius:50%;display:flex;
  align-items:center;justify-content:center;
  font-size:18px;
}

/* BANNIÈRE */
.hero{
  height:390px;
  position:relative;
  overflow:hidden;
  background:#111;
}
.hero img{
  width:100%;
  height:100%;
  object-fit:cover;
}
.hero:after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(
    transparent 50%,
    rgba(255,255,255,.85)
  );
}
.socials{
  position:absolute;
  bottom:25px;
  left:50%;
  transform:translateX(-50%);
  display:flex;
  gap:12px;
  z-index:3;
}
.social{
  width:62px;height:62px;
  border-radius:17px;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(8px);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

/* TITRE */
.shop-title{
  background:#fff;
  text-align:center;
  padding:24px 8px 30px;
  font-size:29px;
  font-weight:900;
}

/* SECTIONS */
.section{padding:28px 20px}
.section-title{
  color:#929299;
  font-size:21px;
  font-weight:800;
  margin-bottom:20px;
  display:flex;
  align-items:center;
  gap:14px;
}
.section-title:before{
  content:"";
  width:5px;height:30px;
  background:#888;
}

/* CATÉGORIES */
.categories{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:18px;
}
.category{
  background:#fff;
  border-radius:26px;
  padding:30px 10px 25px;
  text-align:center;
  box-shadow:0 4px 15px rgba(0,0,0,.05);
}
.category-img{
  width:110px;
  height:65px;
  object-fit:cover;
  border-radius:5px;
  margin-bottom:22px;
}
.category-name{
  font-size:23px;
  font-weight:750;
  margin-bottom:18px;
}
.flags{font-size:23px;letter-spacing:4px}

/* PRODUITS */
.products{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}
.product{
  background:#fff;
  border-radius:24px;
  overflow:hidden;
  box-shadow:0 4px 15px rgba(0,0,0,.06);
}
.product img{
  width:100%;
  height:190px;
  object-fit:cover;
}
.content{padding:15px}
.badge{
  display:inline-block;
  background:#050505;
  color:#fff;
  border-radius:11px;
  padding:8px 10px;
  font-size:12px;
  font-weight:800;
  margin-bottom:13px;
}
.product-name{
  font-size:20px;
  font-weight:900;
  margin-bottom:17px;
}
.button{
  width:100%;
  background:#fff;
  border:2px solid #111;
  border-radius:16px;
  padding:13px 5px;
  font-size:17px;
  font-weight:700;
}

/* BARRE DU BAS */
.bottom{
  position:fixed;
  z-index:50;
  bottom:15px;
  left:20px;
  right:20px;
  height:78px;
  border-radius:42px;
  background:rgba(255,255,255,.95);
  backdrop-filter:blur(15px);
  box-shadow:0 5px 25px rgba(0,0,0,.13);
  display:flex;
  align-items:center;
  justify-content:space-around;
}
.nav{
  color:#999;
  font-size:28px;
  display:flex;
  align-items:center;
  justify-content:center;
}
.nav.active{
  color:#fff;
  background:#000;
  border-radius:38px;
  width:150px;
  height:58px;
  gap:10px;
}
.nav.active span{
  font-size:19px;
  font-weight:700;
}

/* PETIT ÉCRAN */
@media(max-width:380px){
  .hero{height:350px}
  .product img{height:165px}
  .product-name{font-size:18px}
  .category-name{font-size:20px}
  .nav.active{width:130px}
}
</style>
</head>

<body>

<div class="app">

  <!-- HEADER -->
  <header class="header">
    <div class="close">Close</div>

    <div class="title">
      <b>🥷 HEISENBERG44 🥷</b>
      <span>mini app</span>
    </div>

    <div class="menu">•••</div>
  </header>


  <!-- IMAGE HEISENBERG44 -->
  <section class="hero">
    <img src="E1129400-930B-4D6B-AFDF-C96B2D9968C3.png" alt="HEISENBERG44">

    <div class="socials">
      <div class="social">✈️</div>
      <div class="social">◎</div>
      <div class="social">◉</div>
      <div class="social">🔗</div>
      <div class="social">◎</div>
    </div>
  </section>


  <!-- TITRE -->
  <div class="shop-title">
    HEISENBERG44 SHOP 🥷
  </div>


  <!-- CATÉGORIES -->
  <section class="section">

    <div class="section-title">CATÉGORIES</div>

    <div class="categories">

      <div class="category">
        <img class="category-img" src="heisenberg44.jpg">
        <div class="category-name">Hash 🧱</div>
        <div class="flags">🇲🇦 🇪🇸 🇺🇸</div>
      </div>

      <div class="category">
        <img class="category-img" src="heisenberg44.jpg">
        <div class="category-name">Weed 🌿</div>
        <div class="flags">🇲🇦 🇪🇸 🇺🇸</div>
      </div>

    </div>
  </section>


  <!-- RÉCENTS -->
  <section class="section">

    <div class="section-title">RÉCENTS</div>

    <div class="products">

      <div class="product">
        <img src="heisenberg44.jpg">

        <div class="content">
          <div class="badge">🟡 JAUNE MOUSSEUX 🟡</div>

          <div class="product-name">
            TOP ULTRA MOUSS 🔥
          </div>

          <button class="button">
            Voir les détails
          </button>
        </div>
      </div>


      <div class="product">
        <img src="heisenberg44.jpg">

        <div class="content">
          <div class="badge">🇲🇦 NEWS TOP 🔥</div>

          <div class="product-name">
            MARACUJA ⚡
          </div>

          <button class="button">
            Voir les détails
          </button>
        </div>
      </div>

    </div>
  </section>


  <!-- TENDANCES -->
  <section class="section">

    <div class="section-title">TENDANCES</div>

    <div class="products">

      <div class="product">
        <img src="heisenberg44.jpg">

        <div class="content">
          <div class="badge">🇪🇸 TOP SHELF</div>

          <div class="product-name">
            TROPICANA
          </div>

          <button class="button">
            Voir les détails
          </button>
        </div>
      </div>

    </div>
  </section>


  <!-- NAVIGATION -->
  <nav class="bottom">

    <div class="nav">🛍️</div>

    <div class="nav active">
      🏠
      <span>Shop</span>
    </div>

    <div class="nav">👤</div>

  </nav>

</div>

</body>
</html>
