<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ma Boutique CBD</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #1d3b2a;
      color: white;
      padding: 25px 20px;
      text-align: center;
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      opacity: 0.85;
    }

    .products {
      padding: 20px;
      display: grid;
      gap: 16px;
    }

    .product {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .product img {
      width: 100%;
      height: 190px;
      object-fit: cover;
    }

    .product-content {
      padding: 16px;
    }

    .product h2 {
      margin: 0 0 8px;
      font-size: 20px;
    }

    .description {
      color: #666;
      font-size: 14px;
      line-height: 1.4;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin: 14px 0;
    }

    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 13px;
      background: #1d3b2a;
      color: white;
      font-size: 16px;
      font-weight: bold;
    }

    #cart {
      position: fixed;
      bottom: 15px;
      left: 15px;
      right: 15px;
      background: #1d3b2a;
      color: white;
      padding: 15px;
      border-radius: 14px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<header>
  <h1>🌿 Ma Boutique CBD</h1>
  <p>Découvrez notre sélection</p>
</header>

<div class="products">

  <div class="product">
    <img src="https://via.placeholder.com/600x400" alt="Produit CBD">
    <div class="product-content">
      <h2>Fleurs CBD</h2>
      <div class="description">
        Produit CBD à remplacer par ta description.
      </div>
      <div class="price">15,00 €</div>
      <button onclick="addToCart('Fleurs CBD', 15)">
        Ajouter au panier
      </button>
    </div>
  </div>

  <div class="product">
    <img src="https://via.placeholder.com/600x400" alt="Huile CBD">
    <div class="product-content">
      <h2>Huile CBD</h2>
      <div class="description">
        Produit CBD à remplacer par ta description.
      </div>
      <div class="price">25,00 €</div>
      <button onclick="addToCart('Huile CBD', 25)">
        Ajouter au panier
      </button>
    </div>
  </div>

</div>

<div id="cart">
  🛒 Panier : <span id="cartCount">0</span> article(s)
</div>

<script>
  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  let cart = [];

  function addToCart(name, price) {
    cart.push({
      name: name,
      price: price
    });

    document.getElementById("cartCount").textContent = cart.length;

    if (tg.HapticFeedback) {
      tg.HapticFeedback.impactOccurred("light");
    }
  }
</script>

</body>
</html>
