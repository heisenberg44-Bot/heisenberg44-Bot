<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0f1f">
<title>LeHeisenberg44</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  color-scheme:dark;
  --night:#0a0f1f; --ink:#f1e9ff; --muted:#b7a6d9;
  --violet:#9b6bf2; --lilac:#d6b9ff; --blue:#2f6bff; --cyan:#52c4ff; --jungle:#2e8b4f; --lime:#8dffb0; --fendi:#5b3a24;
  --glass:rgba(24,12,52,.62); --line:rgba(160,110,255,.45);
  --display:"Lilita One","Trebuchet MS",sans-serif;
  --body:"Outfit",system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0}
html{-webkit-text-size-adjust:100%}
body{
  color:var(--ink);font:400 16px/1.5 var(--body);min-height:100vh;padding-bottom:110px;overflow-x:hidden;
  background:
    radial-gradient(900px 500px at 15% -5%, rgba(111,50,230,.75), transparent 60%),
    radial-gradient(800px 500px at 100% 8%, rgba(20,130,190,.6), transparent 55%),
    radial-gradient(700px 500px at 50% 100%, rgba(31,157,98,.35), transparent 60%),
    var(--night);
  background-attachment:fixed;
}
body::before{ /* aurore animée */
  content:"";position:fixed;inset:-30%;z-index:-1;pointer-events:none;
  background:conic-gradient(from 0deg at 50% 50%, rgba(143,91,255,.22), rgba(82,196,255,.16), rgba(31,157,98,.18), rgba(143,91,255,.22));
  filter:blur(80px);animation:spin 28s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* particules */
#fx{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#fx span{position:absolute;bottom:-40px;opacity:0;animation:rise linear infinite;filter:drop-shadow(0 0 6px rgba(141,255,176,.7))}
#fx .sticker{filter:drop-shadow(0 0 8px rgba(143,91,255,.9))}
#fx .sticker img{display:block;height:auto}
@keyframes rise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.85}90%{opacity:.6}100%{transform:translateY(-115vh) rotate(360deg);opacity:0}}

/* hero */
.hero{position:relative;z-index:1;text-align:center;padding:calc(34px + env(safe-area-inset-top,0px)) 18px 26px;background-size:cover;background-position:center}
.hero.has-img::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,15,31,.25),var(--night));z-index:-1}
.crown{font-size:40px;display:block;animation:floaty 3s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffd34d)}
.title{
  position:relative;isolation:isolate;display:inline-block;white-space:nowrap;max-width:100%;
  font:400 clamp(34px,11.5vw,84px)/1.1 var(--display);letter-spacing:.01em;
  color:transparent;animation:titlefloat 4s ease-in-out infinite;
}
/* couche arrière : contour bleu électrique + halo */
.title::before{
  content:attr(data-text);position:absolute;inset:0;z-index:0;
  color:#2f6bff;-webkit-text-stroke:9px #2f6bff;
  filter:drop-shadow(0 0 12px var(--cyan));animation:glow 2.4s ease-in-out infinite alternate;
}
/* couche avant : remplissage violet en deux tons, par-dessus le contour */
.title::after{
  content:attr(data-text);position:absolute;inset:0;z-index:1;
  background:linear-gradient(180deg,#efe2ff 0%,#d9bdff 48%,#7a3fe0 52%,#9457f0 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
@keyframes glow{from{filter:drop-shadow(0 0 8px var(--cyan))}to{filter:drop-shadow(0 0 24px var(--cyan)) drop-shadow(0 0 38px var(--blue))}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
@keyframes titlefloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-7px) rotate(-3deg)}}
.tag{margin-top:14px;color:var(--lilac);font-weight:500}
.slot{cursor:pointer}
.slot:is(a[href]):active{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 0 26px rgba(82,196,255,.6)}
.tglogo{width:28px;height:28px;flex:none;margin-right:8px;filter:drop-shadow(0 0 8px rgba(39,166,229,.9))}
.siglogo{width:28px;height:28px;flex:none;margin-right:8px;filter:drop-shadow(0 0 8px rgba(58,118,240,.9))}
.slots{display:flex;justify-content:center;gap:12px;margin:20px auto 0;max-width:420px}
.slot{flex:1 1 0;min-width:0;height:76px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 10px;text-decoration:none;color:var(--lilac);font:400 18px/1.2 var(--display);text-shadow:0 0 14px rgba(143,91,255,.9);transition:transform .2s,box-shadow .2s,border-color .2s;border-radius:16px;border:1.5px solid var(--line);background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);box-shadow:0 0 18px rgba(143,91,255,.35)}

main{position:relative;z-index:1;max-width:980px;margin:0 auto;padding:6px 16px 20px}
.filters{display:flex;gap:8px;overflow-x:auto;padding:24px 16px 32px;margin:-24px -16px -18px;scrollbar-width:none}
.filters::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:var(--glass);color:var(--ink);font:600 14px var(--body);padding:9px 16px;border-radius:999px;cursor:pointer;transition:.2s}
.chip[aria-pressed=true]{background:linear-gradient(90deg,var(--violet),var(--blue));background-origin:border-box;border-color:transparent;box-shadow:0 0 16px rgba(82,196,255,.55)}

.chip.emoji{font-size:20px;padding:5px 16px;line-height:1.3}
.chip.has-img{display:flex;align-items:center;padding:4px 12px}
.chip.has-img img{height:34px;width:auto;display:block;transform:rotate(-4deg);filter:drop-shadow(0 2px 5px rgba(0,0,0,.45));transition:transform .2s}
.chip.has-img:active img{transform:rotate(4deg) scale(1.08)}
.empty-cat{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px 0;font-weight:500}
.zone{margin-top:8px;color:var(--lime);font-weight:600;font-size:14px;text-wrap:balance;text-shadow:0 0 14px rgba(141,255,176,.55)}
.road{position:relative;height:58px;max-width:420px;margin:14px auto 0;overflow:hidden}
.road::before{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;border-radius:3px;background:rgba(10,15,31,.75);box-shadow:0 0 12px rgba(143,91,255,.35)}
.road::after{content:"";position:absolute;left:0;right:0;bottom:2px;height:2px;background:repeating-linear-gradient(90deg,var(--lilac) 0 10px,transparent 10px 22px);opacity:.65;animation:dash .5s linear infinite}
@keyframes dash{to{background-position:-22px 0}}
.truck{position:absolute;bottom:4px;left:-80px;width:70px;height:38px;z-index:2;animation:drive var(--D,8s) linear infinite;filter:drop-shadow(0 0 8px rgba(143,91,255,.7))}
.truck svg{display:block;animation:truckbob .35s ease-in-out infinite alternate}
@keyframes drive{from{left:-80px}to{left:100%}}
@keyframes truckbob{from{transform:translateY(0)}to{transform:translateY(-1.2px)}}
.spin{transform-box:fill-box;transform-origin:center;animation:wheel .45s linear infinite}
@keyframes wheel{to{transform:rotate(360deg)}}
.parcel{position:absolute;bottom:6px;font-size:20px;line-height:1;opacity:0;z-index:1}
@media (prefers-reduced-motion:reduce){.truck{left:50%!important;margin-left:-35px}}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(min-width:700px){.grid{grid-template-columns:repeat(3,1fr);gap:20px}}
.card{
  position:relative;text-align:left;color:inherit;font:inherit;padding:0;cursor:pointer;display:flex;flex-direction:column;overflow:hidden;
  background:var(--glass);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  border:1.5px solid var(--line);border-radius:24px 24px 24px 6px;
  box-shadow:0 0 0 rgba(0,0,0,0);transition:transform .25s,box-shadow .25s,border-color .25s;
  animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i,0) * 90ms);
}
@keyframes pop{from{opacity:0;transform:translateY(30px) scale(.9)}to{opacity:1;transform:none}}
.card:active{transform:translateY(-5px) rotate(-.8deg);border-color:var(--blue);box-shadow:0 10px 34px rgba(82,196,255,.45),0 0 22px rgba(143,91,255,.5)}
@media (hover:hover){.card:hover{transform:translateY(-5px) rotate(-.8deg);border-color:var(--blue);box-shadow:0 10px 34px rgba(82,196,255,.45),0 0 22px rgba(143,91,255,.5)}.slot:is(a[href]):hover{transform:translateY(-3px);border-color:var(--cyan);box-shadow:0 0 26px rgba(82,196,255,.6)}}
.thumb{position:relative;aspect-ratio:1/1;display:grid;place-items:center;font:400 72px var(--display);color:rgba(255,255,255,.92);background-size:cover;background-position:center;overflow:hidden;text-shadow:0 0 20px rgba(0,0,0,.4)}
.thumb::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.35),transparent);transform:skewX(-20deg);animation:shine 4s ease-in-out infinite}
@keyframes shine{0%,60%{left:-60%}100%{left:140%}}
.info{padding:12px 14px 15px}
.card h2{font:400 20px/1.15 var(--display);letter-spacing:.01em}
.meta{color:var(--muted);font-size:13px;margin-top:2px}
.price{display:inline-block;margin-top:9px;font-weight:700;color:var(--lime);text-shadow:0 0 12px rgba(141,255,176,.6)}
:focus-visible{outline:3px solid var(--lime);outline-offset:2px}

/* barre panier flottante */
.cartbar{
  position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:9;
  display:flex;align-items:center;gap:12px;white-space:nowrap;border:0;cursor:pointer;color:#fff;font:700 17px var(--body);
  padding:14px 24px;border-radius:999px;
  background:linear-gradient(90deg,var(--violet),var(--blue),var(--violet));background-size:200% 100%;
  box-shadow:0 8px 30px rgba(82,196,255,.55),0 0 0 0 rgba(143,91,255,.7);
  animation:slide 4s linear infinite,pulse 2.2s infinite;
}
.cartbar.bump{animation:slide 4s linear infinite,bump .45s}
@keyframes slide{to{background-position:200% 0}}
@keyframes pulse{70%{box-shadow:0 8px 30px rgba(82,196,255,.55),0 0 0 16px rgba(143,91,255,0)}100%{box-shadow:0 8px 30px rgba(82,196,255,.55),0 0 0 0 rgba(143,91,255,0)}}
@keyframes bump{30%{transform:translateX(-50%) scale(1.18) rotate(-3deg)}60%{transform:translateX(-50%) scale(.95)}}
.badge{background:#fff;color:#4a1fb0;border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-size:14px;padding:0 7px}

/* feuilles */
.scrim{position:fixed;inset:0;background:rgba(5,5,20,.7);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
.scrim.on{opacity:1;pointer-events:auto}
body.lock{overflow:hidden}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:11;max-width:560px;margin:0 auto;max-height:88vh;overflow:auto;
  background:linear-gradient(180deg,#241049,#120a2b);border:1.5px solid var(--line);border-bottom:0;border-radius:28px 28px 0 0;
  padding:24px 18px calc(24px + env(safe-area-inset-bottom,0px));visibility:hidden;transform:translateY(105%);transition:transform .35s cubic-bezier(.2,1,.3,1),visibility 0s .35s;box-shadow:0 -10px 50px rgba(143,91,255,.45)}
.sheet.on{visibility:visible;transform:none;transition:transform .35s cubic-bezier(.2,1,.3,1),visibility 0s}
.sheet h3{font:400 30px var(--display);margin-bottom:4px;color:var(--lilac);text-shadow:0 0 16px rgba(143,91,255,.8)}
.sheet p{color:var(--muted)}
.opts{display:grid;gap:9px;margin:18px 0}
.opt{display:flex;justify-content:space-between;border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;background:rgba(255,255,255,.04);color:var(--ink);font:600 16px var(--body);cursor:pointer;transition:.18s}
.opt[aria-pressed=true]{border-color:var(--lime);background:rgba(141,255,176,.12);box-shadow:0 0 18px rgba(141,255,176,.35);transform:scale(1.02)}
.primary{width:100%;border:0;color:#fff;font:700 18px var(--body);padding:16px;border-radius:16px;cursor:pointer;
  background:linear-gradient(90deg,var(--violet),var(--blue),var(--jungle),var(--violet));background-size:300% 100%;animation:slide 5s linear infinite;box-shadow:0 8px 26px rgba(82,196,255,.45)}
.primary:active{transform:scale(.97)}
.line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid rgba(160,110,255,.25);animation:pop .35s both}
.line .n{flex:1}.line small{color:var(--muted);display:block}
.qty{display:flex;align-items:center;gap:9px;font-weight:700}
.qty button{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);font-size:19px;cursor:pointer}
.total{display:flex;justify-content:space-between;font:400 28px var(--display);margin:18px 0;color:var(--lime);text-shadow:0 0 16px rgba(141,255,176,.5)}
textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:12px;background:rgba(255,255,255,.05);color:var(--ink);font:inherit;margin-bottom:14px;resize:vertical}
textarea::placeholder{color:var(--muted)}
.empty{padding:30px 0;text-align:center;color:var(--muted)}
.toast{white-space:nowrap;max-width:92vw;text-align:center;position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top,0px));transform:translateX(-50%) translateY(-30px);background:linear-gradient(90deg,var(--violet),var(--blue));color:#fff;padding:11px 18px;border-radius:999px;opacity:0;transition:.25s;z-index:30;font-weight:600;box-shadow:0 6px 24px rgba(82,196,255,.5)}
.toast.on{opacity:1;transform:translateX(-50%)}
.foot{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:14px;margin:26px 0 10px}
.foot a{color:var(--lilac);font-weight:600}
.burst{position:fixed;z-index:40;pointer-events:none;font-size:22px;animation:burst .8s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(220deg);opacity:0}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="fx" aria-hidden="true"></div>

<header class="hero" id="hero">
  <span class="crown" aria-hidden="true">👑</span>
  <h1 class="title" id="shopName"></h1>
  <div class="tag" id="shopTag"></div>
  <div class="zone" id="shopZone"></div>
  <div class="road" id="road" aria-hidden="true">
    <span class="parcel">📦</span><span class="parcel">📦</span><span class="parcel">📦</span>
    <div class="truck" id="truck"><svg viewBox="0 0 70 38" width="70" height="38">
        <rect x="1" y="3" width="42" height="24" rx="3" fill="#8f5bff"/>
        <rect x="1" y="3" width="42" height="7" rx="3" fill="#b58cff" opacity=".55"/>
        <text x="22" y="22" text-anchor="middle" font-family="Lilita One,Arial,sans-serif" font-size="14" fill="#fff">44</text>
        <path d="M45 10h12.5c1.2 0 2.2.6 2.8 1.6l5 7.6c.4.6.7 1.3.7 2V27H45z" fill="#2f6bff"/>

        <g transform="translate(14 31)"><g class="spin"><circle r="6" fill="#12122a" stroke="#cdb2ff" stroke-width="1.2"/><circle r="2" fill="#cdb2ff"/><path d="M0-5V5M-5 0H5" stroke="#cdb2ff" stroke-width="1"/></g></g>
        <g transform="translate(34 31)"><g class="spin"><circle r="6" fill="#12122a" stroke="#cdb2ff" stroke-width="1.2"/><circle r="2" fill="#cdb2ff"/><path d="M0-5V5M-5 0H5" stroke="#cdb2ff" stroke-width="1"/></g></g>
        <g transform="translate(58 31)"><g class="spin"><circle r="6" fill="#12122a" stroke="#cdb2ff" stroke-width="1.2"/><circle r="2" fill="#cdb2ff"/><path d="M0-5V5M-5 0H5" stroke="#cdb2ff" stroke-width="1"/></g></g>
      </svg></div>
  </div>
  <div class="slots"><a class="slot" id="slotSignal" target="_blank" rel="noopener"><svg class="siglogo" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="6" fill="#3a76f0"/><circle cx="12" cy="12" r="9" fill="none" stroke="#fff" stroke-width="1.1" stroke-dasharray="1 1.7" stroke-linecap="round"/><circle cx="12" cy="11.8" r="6.2" fill="#fff"/><path fill="#fff" d="M6.4 18.6l.7-4.1 3.3 2.7z"/></svg><span>Contact<br>Signal&nbsp;📲</span></a><a class="slot" id="slotTelegram" target="_blank" rel="noopener"><svg class="tglogo" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="12" fill="#27a6e5"/><path fill="#fff" d="M5.4 11.9 17.7 7.2c.6-.2 1.1.15.9.9l-1.9 8.8c-.15.6-.5.75-1 .4l-2.8-2-1.3 1.25c-.15.15-.3.3-.6.3l.25-2.75 5.15-4.6c.25-.2-.05-.35-.3-.15l-6.2 3.85-2.8-.85c-.6-.2-.6-.6.1-.85z"/></svg><span>Contact<br>Telegram&nbsp;📲</span></a></div>
</header>

<main>
  <div class="filters" id="filters"></div>
  <div class="grid" id="grid"></div>
  <p class="foot" id="foot"></p>
</main>

<button class="cartbar" id="openCart"><span>🛒 Panier</span><span class="badge" id="count">0</span><span id="barTotal"></span></button>

<div class="scrim" id="scrim"></div>
<section class="sheet" id="productSheet" aria-modal="true" role="dialog"></section>
<section class="sheet" id="cartSheet" aria-modal="true" role="dialog"></section>
<div class="toast" id="toast"></div>

<script>
/* ================= CONFIGURATION : modifie uniquement cette partie ================= */
const CONFIG = {
  shopName: "LeHeisenberg44",
  tagline: "Le labo est ouvert 24h/24 - 7j/7",
  zone: "Disponible dans tous les Pays de la Loire",
  telegramUser: "LeHeisenberg44",   // sans le @
  currency: "€",
  signalLink: "https://signal.me/#eu/WN-12hcBzd9Ewaq0vFOZoRaNlWiT4eB6m9WSHIoJaQufYgj4MrRM8oVmJIyT762l",   // ton lien Signal
  // Catégories affichées sous les contacts (après « Tout »). name = texte ou emoji ; image = chemin d'une image, ou "@sticker" pour le sticker intégré.
  // Chaque produit est rangé dans une catégorie grâce à son champ category (même nom).
  categories: [
    { name:"🍫" },
    { name:"Sticker", image:"@sticker" },
    { name:"🍬" },
    { name:"❄️" }
  ],
  banner: "",   // optionnel : chemin de ton image d'en-tête (ex: "banner.jpg")
  products: [
    { id:"p1", name:"Produit exemple 1", category:"🍫", desc:"Courte description du produit.", image:"", color:"linear-gradient(135deg,#6f32e6,#2ea8ff)",
      variants:[{label:"Petit", price:10},{label:"Moyen", price:18},{label:"Grand", price:30}] },
    { id:"p2", name:"Produit exemple 2", category:"🍫", desc:"Courte description du produit.", image:"", color:"linear-gradient(135deg,#1f9d62,#2ea8ff)",
      variants:[{label:"Petit", price:12},{label:"Moyen", price:22}] },
    { id:"p3", name:"Produit exemple 3", category:"Sticker", desc:"Courte description du produit.", image:"", color:"linear-gradient(135deg,#b04dff,#ff5fa8)",
      variants:[{label:"Unité", price:25}] },
    { id:"p4", name:"Produit exemple 4", category:"Sticker", desc:"Courte description du produit.", image:"", color:"linear-gradient(135deg,#2ea8ff,#8dffb0)",
      variants:[{label:"Unité", price:40}] }
  ]

const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { try { tg.ready(); tg.expand(); tg.setHeaderColor("#0a0f1f"); tg.setBackgroundColor("#0a0f1f"); } catch(e){} }

const $ = s => document.querySelector(s);
const fmt = n => n.toFixed(n % 1 ? 2 : 0).replace(".", ",") + " " + CONFIG.currency;
let cart = [], filter = "Tout", current = null, chosen = 0;

try { cart = JSON.parse(localStorage.getItem("cart") || "[]"); } catch(e){ cart = []; }
cart = cart.filter(i => i && CONFIG.products.some(p => p.id === i.pid && p.variants.some(v => v.label === i.label)) && i.qty > 0);
const save = () => { try { localStorage.setItem("cart", JSON.stringify(cart)); } catch(e){} };
const find = id => CONFIG.products.find(p => p.id === id);
const priceOf = (pid, label) => { const p = find(pid); const v = p && p.variants.find(v => v.label === label); return v ? v.price : 0; };
const total = () => cart.reduce((t, i) => t + i.qty * priceOf(i.pid, i.label), 0);

/* en-tête */
$("#shopName").textContent = CONFIG.shopName;
$("#shopName").setAttribute("data-text", CONFIG.shopName);
$("#shopTag").textContent = CONFIG.tagline;
$("#shopZone").textContent = "📍 " + CONFIG.zone;
document.title = CONFIG.shopName;
if (CONFIG.banner){ const h = $("#hero"); h.style.backgroundImage = `url('${CONFIG.banner}')`; h.classList.add("has-img"); }
(function(){
  const sg = $("#slotSignal"), tl = $("#slotTelegram");
  if (CONFIG.signalLink) sg.href = CONFIG.signalLink;
  else sg.addEventListener("click", () => toast("Lien Signal bientôt disponible"));
  sg.addEventListener("click", e => { if (tg && tg.openLink && sg.href){ e.preventDefault(); tg.openLink(sg.href); } });
  tl.href = `https://t.me/${CONFIG.telegramUser}`;
  tl.addEventListener("click", e => { if (tg && tg.openTelegramLink){ e.preventDefault(); tg.openTelegramLink(tl.href); } });
})();

function burst(x, y){
  const icons = ["✨","🍃","💜","⭐"];
  for (let i = 0; i < 9; i++){
    const b = document.createElement("span");
    b.className = "burst"; b.textContent = icons[i % icons.length];
    const a = (Math.PI*2*i)/9, d = 60 + Math.random()*50;
    b.style.left = x + "px"; b.style.top = y + "px";
    b.style.setProperty("--dx", Math.cos(a)*d + "px"); b.style.setProperty("--dy", Math.sin(a)*d + "px");
    document.body.appendChild(b); setTimeout(() => b.remove(), 850);
  }
}

function renderFilters(){
  const listed = (CONFIG.categories || []).map(c => typeof c === "string" ? {name:c} : c);
  const extra = [...new Set(CONFIG.products.map(p => p.category))].filter(n => !listed.some(c => c.name === n)).map(n => ({name:n}));
  const cats = [{name:"Tout"}, ...listed, ...extra];
  $("#filters").innerHTML = "";
  cats.forEach(c => {
    const b = document.createElement("button");
    b.className = "chip"; b.setAttribute("aria-pressed", c.name === filter);
    if (c.image){
      b.classList.add("has-img");
      const im = document.createElement("img");
      im.src = c.image === "@sticker" ? ASSETS.sticker : c.image; im.alt = ""; b.appendChild(im);
      b.setAttribute("aria-label", c.name);
    } else {
      b.textContent = c.name;
      if (/^[^\p{L}\p{N}]+$/u.test(c.name)) b.classList.add("emoji");
    }
    b.onclick = () => { filter = c.name; renderFilters(); renderGrid(); };
    $("#filters").appendChild(b);
  });
}
function renderGrid(){
  const g = $("#grid"); g.innerHTML = "";
  const shown = CONFIG.products.filter(p => filter === "Tout" || p.category === filter);
  if (!shown.length){ const e = document.createElement("div"); e.className = "empty-cat"; e.textContent = "Bientôt disponible 🧪"; g.appendChild(e); }
  shown.forEach((p, i) => {
    const min = Math.min(...p.variants.map(v => v.price));
    const el = document.createElement("button");
    el.className = "card"; el.style.setProperty("--i", i);
    el.innerHTML = `<div class="thumb"></div><div class="info"><h2></h2><div class="meta"></div><div class="price"></div></div>`;
    const t = el.querySelector(".thumb");
    if (p.image) t.style.backgroundImage = `url('${p.image}')`;
    else { t.style.background = p.color || "linear-gradient(135deg,#6f32e6,#2ea8ff)"; t.textContent = p.name.charAt(0); }
    el.querySelector("h2").textContent = p.name;
    el.querySelector(".meta").textContent = p.category;
    el.querySelector(".price").textContent = (p.variants.length > 1 ? "dès " : "") + fmt(min);
    el.onclick = () => openProduct(p);
    g.appendChild(el);
  });
}

function show(sheet){ $("#scrim").classList.add("on"); sheet.classList.add("on"); document.body.classList.add("lock"); }
function closeAll(){ $("#scrim").classList.remove("on"); document.querySelectorAll(".sheet").forEach(s => s.classList.remove("on")); document.body.classList.remove("lock"); }
$("#scrim").onclick = closeAll;
document.addEventListener("keydown", e => { if (e.key === "Escape") closeAll(); });

function openProduct(p){
  current = p; chosen = 0;
  const s = $("#productSheet");
  s.innerHTML = `<h3></h3><p></p><div class="opts"></div><button class="primary">Ajouter au panier</button>`;
  s.querySelector("h3").textContent = p.name;
  s.querySelector("p").textContent = p.desc;
  const opts = s.querySelector(".opts");
  const draw = () => {
    opts.innerHTML = "";
    p.variants.forEach((v, i) => {
      const b = document.createElement("button");
      b.className = "opt"; b.setAttribute("aria-pressed", i === chosen);
      b.innerHTML = `<span></span><span>${fmt(v.price)}</span>`;
      b.firstChild.textContent = v.label;
      b.onclick = () => { chosen = i; draw(); };
      opts.appendChild(b);
    });
  };
  draw();
  s.querySelector(".primary").onclick = e => {
    addToCart(p.id, p.variants[chosen].label);
    burst(e.clientX || innerWidth/2, e.clientY || innerHeight/2);
    closeAll(); toast("Ajouté au panier 🛒");
  };
  show(s);
}

function addToCart(pid, label){
  const l = cart.find(i => i.pid === pid && i.label === label);
  if (l) l.qty++; else cart.push({pid, label, qty:1});
  save(); updateCount();
  const bar = $("#openCart"); bar.classList.remove("bump"); void bar.offsetWidth; bar.classList.add("bump");
}
function updateCount(){
  $("#count").textContent = cart.reduce((n, i) => n + i.qty, 0);
  $("#barTotal").textContent = cart.length ? fmt(total()) : "";
}

function openCart(){
  const s = $("#cartSheet");
  if (!cart.length){
    s.innerHTML = `<h3>Panier</h3><div class="empty">Ton panier est vide. Choisis un produit pour commencer 👽</div>`;
    show(s); return;
  }
  s.innerHTML = `<h3>Panier</h3><div id="lines"></div>
    <div class="total"><span>Total</span><span>${fmt(total())}</span></div>
    <textarea id="note" rows="2" placeholder="Nom, adresse ou remarque pour ta commande (optionnel)"></textarea>
    <button class="primary" id="send">Commander sur Telegram</button>`;
  const lines = s.querySelector("#lines");
  cart.forEach((it, idx) => {
    const p = find(it.pid); if (!p) return;
    const row = document.createElement("div"); row.className = "line";
    row.innerHTML = `<div class="n"><strong></strong><small></small></div>
      <div class="qty"><button aria-label="Retirer">−</button><span>${it.qty}</span><button aria-label="Ajouter">+</button></div>`;
    row.querySelector("strong").textContent = p.name;
    row.querySelector("small").textContent = `${it.label} · ${fmt(priceOf(it.pid, it.label))}`;
    const [minus, plus] = row.querySelectorAll("button");
    minus.onclick = () => { it.qty--; if (it.qty <= 0) cart.splice(idx, 1); save(); updateCount(); openCart(); };
    plus.onclick = () => { it.qty++; save(); updateCount(); openCart(); };
    lines.appendChild(row);
  });
  s.querySelector("#send").onclick = sendOrder;
  show(s);
}
$("#openCart").onclick = openCart;
$("#openCart").addEventListener("animationend", e => { if (e.animationName === "bump") e.currentTarget.classList.remove("bump"); });

function sendOrder(){
  const note = ($("#note").value || "").trim();
  let msg = `Nouvelle commande — ${CONFIG.shopName}\n\n`;
  cart.forEach(i => {
    const p = find(i.pid);
    msg += `• ${i.qty} × ${p.name} (${i.label}) = ${fmt(i.qty * priceOf(i.pid, i.label))}\n`;
  });
  msg += `\nTotal : ${fmt(total())}`;
  if (note) msg += `\n\nRemarque : ${note}`;
  const url = `https://t.me/${CONFIG.telegramUser}?text=${encodeURIComponent(msg)}`;
  let opened = true;
  if (tg && tg.openTelegramLink) tg.openTelegramLink(url); else opened = !!window.open(url, "_blank");
  if (!opened) { location.href = url; return; }
  cart = []; save(); updateCount(); closeAll();
}

let tt;
function toast(t){ const el = $("#toast"); el.textContent = t; el.classList.add("on"); clearTimeout(tt); tt = setTimeout(() => el.classList.remove("on"), 1700); }

/* camion qui roule et laisse tomber des colis */
(function(){
  const road = $("#road"), truck = $("#truck"), parcels = [...road.querySelectorAll(".parcel")];
  const SPOTS = [0.20, 0.42, 0.64];          // où tombent les colis (part de la largeur de la route)
  let style = document.createElement("style"); document.head.appendChild(style);
  function build(){
    const W = road.clientWidth || 340, SPEED = 55;
    const D = (W + 80) / SPEED;                 // durée d'un passage (s)
    let kf = "";
    parcels.forEach((el, i) => {
      const P = Math.round(W * SPOTS[i]);
      const r = ((P + 4 + 80) / (W + 80)) * 100; // moment où l'arrière du camion passe au-dessus du colis
      el.style.left = P + "px";
      el.style.animation = "none"; void el.offsetWidth;
      el.style.animation = `drop${i} ${D}s linear infinite`;
      kf += `@keyframes drop${i}{0%{opacity:0}${r.toFixed(2)}%{opacity:1;transform:translateY(-24px) rotate(-18deg);animation-timing-function:ease-in}${(r+3.5).toFixed(2)}%{transform:translateY(0) rotate(8deg);animation-timing-function:ease-out}${(r+5.5).toFixed(2)}%{transform:translateY(-7px) rotate(0)}${(r+7).toFixed(2)}%{transform:translateY(0) rotate(0)}90%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(0)}}`;
    });
    style.textContent = kf;
    truck.style.setProperty("--D", D + "s");
    truck.style.animation = "none"; void truck.offsetWidth; truck.style.animation = "";
  }
  build();
  let rt; addEventListener("resize", () => { clearTimeout(rt); rt = setTimeout(build, 250); });
})();
